risk_methodology:
  matrix: "3x3 qualitative"
  likelihood_levels:
    - "Low"
    - "Medium"
    - "High"
  impact_levels:
    - "Low"
    - "Medium"
    - "High"
  rating_rules:
    - "Low likelihood + Low impact = Low"
    - "Low likelihood + Medium impact = Low"
    - "Low likelihood + High impact = Medium"
    - "Medium likelihood + Low impact = Low"
    - "Medium likelihood + Medium impact = Medium"
    - "Medium likelihood + High impact = High"
    - "High likelihood + Low impact = Medium"
    - "High likelihood + Medium impact = High"
    - "High likelihood + High impact = High"

risks:

  - id: "R1"
    description: "Unauthorized access to raw EEG biometric and health data"
    privacy_harm: "Exposure of highly sensitive neural and clinical information that could result in discrimination, loss of confidentiality, or misuse of biometric-derived data"
    likelihood: "Medium"
    impact: "High"
    inherent_risk: "High"
    mitigation:
      - "Encrypt EEG data at rest and in transit"
      - "Apply role-based access control and least privilege"
      - "Require strong authentication for privileged access"
      - "Log and review access to neural-signal datasets"
      - "Separate research and production environments"
    residual_likelihood: "Low"
    residual_impact: "High"
    residual_risk: "Medium"
    risk_owner: "Security and Privacy Engineering"
    treatment: "Mitigate"

  - id: "R2"
    description: "Re-identification of patients through device metadata, timestamps, and correlated clinical attributes"
    privacy_harm: "Pseudonymized records could be linked back to an identifiable patient through auxiliary metadata or external datasets"
    likelihood: "Medium"
    impact: "Medium"
    inherent_risk: "Medium"
    mitigation:
      - "Minimize collection of device and session metadata"
      - "Pseudonymize patient identifiers before analytics processing"
      - "Separate identity mapping data from analytical datasets"
      - "Restrict access to linkage keys"
      - "Apply retention limits to identifying metadata"
    residual_likelihood: "Low"
    residual_impact: "Medium"
    residual_risk: "Low"
    risk_owner: "Privacy Engineering"
    treatment: "Mitigate"

  - id: "R3"
    description: "Third-party cloud analytics provider gains excessive access to BCI and health data"
    privacy_harm: "External processor access could exceed approved purposes, increase breach exposure, or create uncontrolled onward-processing risk"
    likelihood: "Medium"
    impact: "High"
    inherent_risk: "High"
    mitigation:
      - "Perform processor due diligence before onboarding"
      - "Use a data processing agreement defining purpose and security obligations"
      - "Limit transferred data to the minimum required"
      - "Use pseudonymized datasets where operationally feasible"
      - "Enforce processor access controls and audit logging"
      - "Review subprocessor and breach-notification obligations"
    residual_likelihood: "Low"
    residual_impact: "High"
    residual_risk: "Medium"
    risk_owner: "Data Protection Officer"
    treatment: "Mitigate and Monitor"

  - id: "R4"
    description: "Cross-border transfer of BCI and health data to a jurisdiction without adequate privacy protections"
    privacy_harm: "Patients may lose equivalent legal protections or effective remedies when sensitive data is transferred internationally"
    likelihood: "Medium"
    impact: "High"
    inherent_risk: "High"
    mitigation:
      - "Assess transfer necessity before permitting cross-border processing"
      - "Apply approved contractual and organizational transfer safeguards where legally permitted"
      - "Perform transfer-risk assessment"
      - "Encrypt data before transfer and restrict key access"
      - "Minimize transferred special-category data"
      - "Require documented approval from privacy and legal stakeholders"
    residual_likelihood: "Low"
    residual_impact: "High"
    residual_risk: "Medium"
    risk_owner: "Data Protection Officer"
    treatment: "Mitigate and Monitor"

acceptance_criteria:
  - "No High residual privacy risk may be accepted without documented executive and privacy approval"
  - "Critical or High-impact special-category processing requires documented enhanced safeguards"
  - "Material changes to purpose, processor, or transfer destination require DPIA reassessment"
